services:
  db:
    image: postgres:18

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: cashout_ops

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: