<!-- backend/app/features/email_verification/templates/verify_email.html -->

<div
  style="
    font-family:
      system-ui,
      -apple-system,
      Segoe UI,
      Roboto,
      sans-serif;
    max-width: 480px;
    margin: 0 auto;
    color: #1a1a1a;
  "
>
  <h1 style="font-size: 20px; margin: 0 0 16px">Verify your email</h1>
  <p style="margin: 0 0 16px; line-height: 1.5">
    Welcome to Whiskey District Cashouts. Enter this code to confirm your email
    address:
  </p>
  <p
    style="
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 6px;
      margin: 0 0 16px;
    "
  >
    {{code}}
  </p>
  <p style="margin: 0; color: #6b6b6b; font-size: 14px; line-height: 1.5">
    The code expires in {{ttl_minutes}} minutes. If you didn't request it, you
    can ignore this email.
  </p>
</div>
