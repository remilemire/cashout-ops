<!-- backend/app/features/email_verification/templates/verify_email.html -->

<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  style="
    background-color: #faf8f5;
    margin: 0;
    padding: 24px 12px;
    font-family:
      system-ui,
      -apple-system,
      Segoe UI,
      Roboto,
      Helvetica,
      Arial,
      sans-serif;
  "
>
  <tr>
    <td align="center">
      <table
        role="presentation"
        width="480"
        cellpadding="0"
        cellspacing="0"
        style="width: 100%; max-width: 480px"
      >
        <tr>
          <td
            style="
              background-color: #ffffff;
              border: 1px solid #e1ddd8;
              border-radius: 12px;
              padding: 32px;
            "
          >
            <p
              style="
                margin: 0 0 24px;
                font-size: 15px;
                font-weight: 600;
                letter-spacing: -0.01em;
              "
            >
              <span style="color: #964d09">Whiskey District</span>
              <span style="color: #291f18"> Cashouts</span>
            </p>
            <h1
              style="
                margin: 0 0 12px;
                font-size: 20px;
                font-weight: 600;
                letter-spacing: -0.01em;
                color: #291f18;
              "
            >
              Verify your email
            </h1>
            <p
              style="
                margin: 0 0 20px;
                font-size: 15px;
                line-height: 1.5;
                color: #291f18;
              "
            >
              Welcome to Whiskey District Cashouts. Enter this code to confirm
              your email address:
            </p>
            <table
              role="presentation"
              width="100%"
              cellpadding="0"
              cellspacing="0"
              style="margin: 0 0 20px"
            >
              <tr>
                <td
                  align="center"
                  style="
                    background-color: #f2f0ec;
                    border: 1px solid #e1ddd8;
                    border-radius: 8px;
                    padding: 16px;
                    font-size: 32px;
                    font-weight: 700;
                    letter-spacing: 8px;
                    color: #291f18;
                  "
                >
                  {{code}}
                </td>
              </tr>
            </table>
            <p
              style="
                margin: 0;
                font-size: 13px;
                line-height: 1.5;
                color: #6e645a;
              "
            >
              The code expires in {{ttl_minutes}} minutes. If you didn't request
              it, you can ignore this email.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
