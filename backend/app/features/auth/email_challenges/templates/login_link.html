<!-- backend/app/features/auth/email_challenges/templates/login_link.html -->

<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  style="
    background-color: #faf8f5;
    margin: 0;
    padding: 24px 12px;
    font-family:
      system-ui,
      -apple-system,
      Segoe UI,
      Roboto,
      Helvetica,
      Arial,
      sans-serif;
  "
>
  <tr>
    <td align="center">
      <table
        role="presentation"
        width="480"
        cellpadding="0"
        cellspacing="0"
        style="width: 100%; max-width: 480px"
      >
        <tr>
          <td
            style="
              background-color: #ffffff;
              border: 1px solid #e1ddd8;
              border-radius: 12px;
              padding: 32px;
            "
          >
            <p
              style="
                margin: 0 0 24px;
                font-size: 15px;
                font-weight: 600;
                letter-spacing: -0.01em;
              "
            >
              <span style="color: #964d09">Whiskey District</span>
              <span style="color: #291f18"> Cashouts</span>
            </p>
            <h1
              style="
                margin: 0 0 12px;
                font-size: 20px;
                font-weight: 600;
                letter-spacing: -0.01em;
                color: #291f18;
              "
            >
              Sign in
            </h1>
            <p
              style="
                margin: 0 0 20px;
                font-size: 15px;
                line-height: 1.5;
                color: #291f18;
              "
            >
              Click the button below to get your one-time sign-in code, then
              enter it in the tab where you started signing in.
            </p>
            <p style="margin: 0 0 20px">
              <a
                href="{{link}}"
                style="
                  background-color: #964d09;
                  border-radius: 8px;
                  color: #ffffff;
                  display: inline-block;
                  font-size: 15px;
                  font-weight: 600;
                  padding: 12px 20px;
                  text-decoration: none;
                "
                >Get my sign-in code</a
              >
            </p>
            <p
              style="
                margin: 0 0 20px;
                font-size: 13px;
                line-height: 1.5;
                color: #6e645a;
              "
            >
              Or copy this link: {{link}}
            </p>
            <p
              style="
                margin: 0;
                font-size: 13px;
                line-height: 1.5;
                color: #6e645a;
              "
            >
              The link expires in {{ttl_minutes}} minutes. If you didn't request
              it, you can ignore this email.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
