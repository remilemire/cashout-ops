<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  style="
    background-color: #faf8f5;
    margin: 0;
    padding: 24px 12px;
    font-family:
      system-ui,
      -apple-system,
      Segoe UI,
      Roboto,
      Helvetica,
      Arial,
      sans-serif;
  "
>
  <tr>
    <td align="center">
      <table
        role="presentation"
        width="480"
        cellpadding="0"
        cellspacing="0"
        style="width: 100%; max-width: 480px"
      >
        <tr>
          <td
            style="
              background-color: #ffffff;
              border: 1px solid #e1ddd8;
              border-radius: 12px;
              padding: 32px;
            "
          >
            <p
              style="
                margin: 0 0 24px;
                font-size: 15px;
                font-weight: 600;
                letter-spacing: -0.01em;
              "
            >
              <span style="color: #964d09">Whiskey District</span>
              <span style="color: #291f18"> Cashouts</span>
            </p>
            <h1
              style="
                margin: 0 0 12px;
                font-size: 20px;
                font-weight: 600;
                letter-spacing: -0.01em;
                color: #291f18;
              "
            >
              Sign in
            </h1>
            <p
              style="
                margin: 0 0 20px;
                font-size: 15px;
                line-height: 1.5;
                color: #291f18;
              "
            >
              Enter this code in the tab where you started signing in.
            </p>
            <p
              style="
                margin: 0 0 20px;
                font-size: 32px;
                font-weight: 700;
                letter-spacing: 0.25em;
                font-variant-numeric: tabular-nums;
                color: #291f18;
              "
            >
              {{code}}
            </p>
            <p
              style="
                margin: 0;
                font-size: 13px;
                line-height: 1.5;
                color: #6e645a;
              "
            >
              The code expires in {{ttl_minutes}} minutes. If you didn't request
              it, you can ignore this email.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
