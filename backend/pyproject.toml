[project]
name = "whiskey-district-cashout-automation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.4",
    "fastapi[standard]==0.136.0",
    "gunicorn==25.3.0",
    "itsdangerous==2.2.0",
    "psycopg[binary]==3.3.3",
    "pytest==9.0.3",
    "python-dotenv==1.2.2",
    "sqlalchemy[asyncio]==2.0.49",
]

[project.optional-dependencies]
dev = ["ruff==0.15.12"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff.lint]
extend-select = ["I"]