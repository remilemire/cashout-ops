[project]
name = "cashout-ops-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "anthropic>=0.116.0",
    "bcrypt>=4.1",
    "fastapi[standard]>=0.136.3",
    "google-genai>=2.11.0",
    "gunicorn>=26.0.0",
    "itsdangerous>=2.2.0",
    "openai>=2.45.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "resend>=2.34.0",
    "sqlalchemy[asyncio]>=2.0.50",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
    "testcontainers[postgresql]>=4.14.2",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]
markers = [
    "unit: no database, no Docker container, no app instance",
    "integration: full HTTP stack (ASGI client) against a real Postgres",
]

