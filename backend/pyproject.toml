[project]
name = "cashout-ops-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "anthropic>=0.116.0",
    "authlib>=1.7.2",
    "boto3>=1.43.69",
    "fastapi[standard]>=0.136.3",
    "google-cloud-storage>=3.14.1",
    "google-genai>=2.11.0",
    "gunicorn>=26.0.0",
    "itsdangerous>=2.2.0",
    "numpy>=2",
    "onnxruntime>=1.29",
    "openai>=2.45.0",
    "opencv-python-headless>=4.10",
    "pillow>=11",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pypdfium2>=5",
    "python-dotenv>=1.2.2",
    "redis>=5",
    "resend>=2.34.0",
    "sqlalchemy[asyncio]>=2.0.50",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.69",
    "httpx>=0.28.1",
    "pyright>=1.1.411",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
    "testcontainers[postgresql,redis]>=4.14.2",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
# The vendored text-detection model ships with the package (see models/NOTICE).
"app.integrations.ocr" = ["models/*.onnx", "models/NOTICE"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]
markers = [
    "unit: no database, no Redis, no Docker container, no app instance",
    "integration: full HTTP stack (ASGI client) against a real Postgres and Redis",
]

