[project]
name = "cashout-ops-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]>=0.136.3",
    "gunicorn>=26.0.0",
    "itsdangerous>=2.2.0",
    "passlib>=1.7.4",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy[asyncio]>=2.0.50",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff.lint]
extend-select = ["I"]
